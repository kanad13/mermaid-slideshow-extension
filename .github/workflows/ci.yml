name: CI and Deployment

on:
  push:
    branches: [ markmaid-slideshow ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version_check.outputs.changed }}
      new_version: ${{ steps.version_check.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Package extension
        run: npm run package

      - name: Verify .vsix created
        run: |
          if [ ! -f *.vsix ]; then
            echo "Error: .vsix file not created"
            exit 1
          fi
          echo "Package created successfully"

      - name: Check package.json version change
        id: version_check
        run: |
          # Get previous and current version of package.json to see if we should release
          git fetch origin ${{ github.ref_name }} --depth=2 || true

          # Use diff to see if 'version' line changed in package.json
          if git diff HEAD^ HEAD package.json | grep '^+  "version"'; then
            echo "Version bumped!"
            VERSION=$(node -p "require('./package.json').version")
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No version bump detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: lint-and-test
    if: needs.lint-and-test.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Create Git Tag
        env:
          NEW_VERSION: ${{ needs.lint-and-test.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.lint-and-test.outputs.new_version }}
          files: '*.vsix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT"
