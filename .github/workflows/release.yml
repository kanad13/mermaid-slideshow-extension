name: Release Publish

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      commit_message:
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: true

jobs:
  publish:
    if: ${{ inputs.branch_name == 'markmaid-slideshow' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate release commit
        id: release_meta
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)

          if [[ ! "$FIRST_LINE" =~ ^chore:\ release\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release commits must use the exact message: chore: release vX.Y.Z"
            exit 1
          fi

          RELEASE_VERSION="${BASH_REMATCH[1]}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match release commit version ($RELEASE_VERSION)."
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not already exist
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          git fetch --tags origin

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists on origin."
            exit 1
          fi

      - name: Package extension
        run: npm run package

      - name: Verify .vsix created
        run: |
          if [ ! -f *.vsix ]; then
            echo "Error: .vsix file not created"
            exit 1
          fi
          echo "Package created successfully"

      - name: Create Git Tag
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          files: '*.vsix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT"
