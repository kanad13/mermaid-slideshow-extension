<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' https://cdn.jsdelivr.net; style-src 'unsafe-inline';">
	<title>Mermaid Slideshow</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: var(--vscode-editor-background);
			color: var(--vscode-editor-foreground);
			height: 100vh;
			overflow: hidden;
			user-select: none;
		}

		.slide-container {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			padding: 40px 60px;
			position: relative;
		}

		.slide-content {
			width: 100%;
			max-height: calc(100vh - 120px);
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: auto;
		}

		.slide-content .mermaid {
			background: transparent;
			border: none;
			text-align: center;
			width: 100%;
		}

		.slide-content .mermaid svg {
			max-width: 100%;
			max-height: calc(100vh - 140px);
			height: auto;
		}

		.slide-counter {
			position: fixed;
			bottom: 16px;
			right: 20px;
			font-size: 0.85em;
			color: var(--vscode-descriptionForeground);
			background: var(--vscode-editorWidget-background);
			padding: 4px 12px;
			border-radius: 12px;
			border: 1px solid var(--vscode-widget-border, rgba(128,128,128,0.2));
		}

		.nav-arrow {
			position: fixed;
			top: 50%;
			transform: translateY(-50%);
			background: transparent;
			border: 1px solid var(--vscode-widget-border, rgba(128,128,128,0.2));
			color: var(--vscode-editor-foreground);
			font-size: 1.4em;
			width: 36px;
			height: 36px;
			border-radius: 50%;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background 0.15s ease, border-color 0.15s ease;
			z-index: 10;
		}

		.nav-arrow:hover {
			background: var(--vscode-list-hoverBackground);
			border-color: var(--vscode-focusBorder);
		}

		.nav-arrow.prev { left: 10px; }
		.nav-arrow.next { right: 10px; }

		.nav-arrow:disabled {
			opacity: 0.3;
			cursor: default;
		}

		.nav-arrow:disabled:hover {
			background: transparent;
			border-color: var(--vscode-widget-border, rgba(128,128,128,0.2));
		}

		.single-slide .nav-arrow,
		.single-slide .slide-counter {
			display: none;
		}

		.notice {
			text-align: center;
			color: var(--vscode-descriptionForeground);
		}

		.notice p { font-size: 1.1em; margin: 8px 0; }
		.notice .hint { font-size: 0.85em; }
		.notice.error { color: var(--vscode-errorForeground); }
	</style>
</head>
<body class="{{SINGLE_SLIDE_CLASS}}">
	<button class="nav-arrow prev" aria-label="Previous slide">&#8249;</button>
	<button class="nav-arrow next" aria-label="Next slide">&#8250;</button>
	<div class="slide-container">
		<div class="slide-content"></div>
	</div>
	<div class="slide-counter"></div>

	<script type="module" nonce="{{NONCE}}">
		const diagrams = {{DIAGRAMS_JSON}};
		const theme = '{{THEME}}';
		let currentIndex = 0;
		let renderToken = 0;

		const container = document.querySelector('.slide-content');
		const counter = document.querySelector('.slide-counter');
		const prevBtn = document.querySelector('.nav-arrow.prev');
		const nextBtn = document.querySelector('.nav-arrow.next');

		// A failed CDN load disables rendering only; navigation and the empty
		// state keep working. Listeners are registered before this promise settles
		// so update messages that arrive during a slow load are not lost.
		const mermaidReady = (async () => {
			try {
				const { default: loaded } = await import('{{MERMAID_URL}}');
				loaded.initialize({ startOnLoad: false, theme });
				return loaded;
			} catch (error) {
				console.error('Mermaid failed to load:', error);
				return null;
			}
		})();

		/**
		 * Replaces the slide area with a text-only notice. textContent is used
		 * so no diagram text or error message is parsed as markup.
		 */
		function showNotice(lines, className) {
			const box = document.createElement('div');
			box.className = 'notice ' + (className || '');
			lines.forEach(([text, hint]) => {
				const p = document.createElement('p');
				p.textContent = text;
				if (hint) p.className = 'hint';
				box.appendChild(p);
			});
			container.replaceChildren(box);
		}

		function updateChrome() {
			const empty = diagrams.length === 0;
			document.body.classList.toggle('single-slide', diagrams.length <= 1);
			counter.textContent = empty ? '' : (currentIndex + 1) + ' / ' + diagrams.length;
			prevBtn.disabled = currentIndex === 0;
			nextBtn.disabled = currentIndex >= diagrams.length - 1;
		}

		async function renderSlide(index) {
			currentIndex = index;
			const token = ++renderToken;
			const slideId = 'mermaid-slide-' + token;
			updateChrome();

			if (diagrams.length === 0) {
				showNotice([
					['No Mermaid diagrams found in this file.'],
					['Add a ```mermaid code block to get started.', true]
				]);
				return;
			}
			const mermaid = await mermaidReady;
			if (token !== renderToken) return;
			if (!mermaid) {
				showNotice([
					['Could not load Mermaid from the CDN.'],
					['Check your network connection, then reopen the slideshow.', true]
				], 'error');
				return;
			}

			try {
				// render() returns SVG that Mermaid has sanitized under its default
				// "strict" security level; the diagram text itself never touches innerHTML.
				const { svg } = await mermaid.render(slideId, diagrams[index]);
				if (token !== renderToken) return;
				const slide = document.createElement('div');
				slide.className = 'mermaid';
				slide.innerHTML = svg;
				container.replaceChildren(slide);
			} catch (error) {
				// A failed render leaves Mermaid's scratch element ("d" + id) in the body.
				document.getElementById('d' + slideId)?.remove();
				if (token !== renderToken) return;
				console.error('Mermaid rendering failed:', error);
				showNotice([['Failed to render diagram ' + (index + 1)]], 'error');
			}
		}

		function goNext() {
			if (currentIndex < diagrams.length - 1) {
				renderSlide(currentIndex + 1);
			}
		}

		function goPrev() {
			if (currentIndex > 0) {
				renderSlide(currentIndex - 1);
			}
		}

		document.addEventListener('keydown', (e) => {
			if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
				e.preventDefault();
				goNext();
			} else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
				e.preventDefault();
				goPrev();
			}
		});

		let scrollCooldown = false;
		document.addEventListener('wheel', (e) => {
			if (scrollCooldown) return;
			scrollCooldown = true;
			setTimeout(() => { scrollCooldown = false; }, 300);

			if (e.deltaY > 0) {
				goNext();
			} else if (e.deltaY < 0) {
				goPrev();
			}
		});

		prevBtn.addEventListener('click', goPrev);
		nextBtn.addEventListener('click', goNext);

		window.addEventListener('message', (event) => {
			const message = event.data;
			if (!message || message.type !== 'update' || !Array.isArray(message.diagrams)) return;
			diagrams.length = 0;
			diagrams.push(...message.diagrams.filter((d) => typeof d === 'string'));
			renderSlide(Math.max(0, Math.min(currentIndex, diagrams.length - 1)));
		});

		renderSlide(0);
	</script>
</body>
</html>
