<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src {{CSP_SOURCE}} https:;">
	<title>Mermaid Slideshow</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: var(--vscode-editor-background);
			color: var(--vscode-editor-foreground);
			height: 100vh;
			overflow: hidden;
			user-select: none;
		}

		.slide-container {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			padding: 40px 60px;
			position: relative;
		}

		.slide-content {
			width: 100%;
			max-height: calc(100vh - 120px);
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: auto;
		}

		/* Mermaid diagram slides */
		.slide-content .mermaid {
			background: transparent;
			border: none;
			text-align: center;
			width: 100%;
		}

		.slide-content .mermaid svg {
			max-width: 100%;
			max-height: calc(100vh - 140px);
			height: auto;
		}

		/* Image slides */
		.slide-content .slide-image {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: calc(100vh - 120px);
		}

		.slide-content .slide-image img {
			max-width: 100%;
			max-height: calc(100vh - 140px);
			width: auto;
			height: auto;
			object-fit: contain;
			border-radius: 4px;
		}

		/* Markdown content slides */
		.slide-content .slide-markdown {
			max-width: 800px;
			width: 100%;
			padding: 20px 40px;
			line-height: 1.7;
			text-align: left;
			user-select: text;
		}

		.slide-markdown h1 {
			font-size: 2em;
			margin: 0.4em 0;
			font-weight: 600;
			border-bottom: 1px solid var(--vscode-widget-border, rgba(128,128,128,0.2));
			padding-bottom: 0.3em;
		}

		.slide-markdown h2 {
			font-size: 1.6em;
			margin: 0.4em 0;
			font-weight: 600;
			border-bottom: 1px solid var(--vscode-widget-border, rgba(128,128,128,0.15));
			padding-bottom: 0.25em;
		}

		.slide-markdown h3 { font-size: 1.3em; margin: 0.4em 0; font-weight: 600; }
		.slide-markdown h4 { font-size: 1.1em; margin: 0.3em 0; font-weight: 600; }
		.slide-markdown h5, .slide-markdown h6 { font-size: 1em; margin: 0.3em 0; font-weight: 600; }

		.slide-markdown p {
			margin: 0.6em 0;
		}

		.slide-markdown ul, .slide-markdown ol {
			margin: 0.5em 0;
			padding-left: 2em;
		}

		.slide-markdown li {
			margin: 0.25em 0;
		}

		.slide-markdown li > ul, .slide-markdown li > ol {
			margin: 0.15em 0;
		}

		.slide-markdown code {
			font-family: 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
			background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.15));
			padding: 0.15em 0.4em;
			border-radius: 3px;
			font-size: 0.9em;
		}

		.slide-markdown pre {
			background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.15));
			padding: 12px 16px;
			border-radius: 6px;
			overflow-x: auto;
			margin: 0.8em 0;
		}

		.slide-markdown pre code {
			background: transparent;
			padding: 0;
			border-radius: 0;
			font-size: 0.85em;
			line-height: 1.5;
		}

		.slide-markdown blockquote {
			border-left: 3px solid var(--vscode-focusBorder, #007acc);
			margin: 0.6em 0;
			padding: 0.3em 1em;
			color: var(--vscode-descriptionForeground);
		}

		.slide-markdown table {
			border-collapse: collapse;
			margin: 0.8em 0;
			width: 100%;
		}

		.slide-markdown th, .slide-markdown td {
			border: 1px solid var(--vscode-widget-border, rgba(128,128,128,0.3));
			padding: 6px 12px;
			text-align: left;
		}

		.slide-markdown th {
			background: var(--vscode-editorWidget-background, rgba(128,128,128,0.1));
			font-weight: 600;
		}

		.slide-markdown strong { font-weight: 600; }
		.slide-markdown em { font-style: italic; }

		.slide-markdown hr {
			border: none;
			border-top: 1px solid var(--vscode-widget-border, rgba(128,128,128,0.2));
			margin: 1em 0;
		}

		.slide-markdown a {
			color: var(--vscode-textLink-foreground, #3794ff);
			text-decoration: none;
		}

		.slide-markdown a:hover {
			text-decoration: underline;
		}

		.slide-markdown img {
			max-width: 100%;
			height: auto;
		}

		/* Slide counter */
		.slide-counter {
			position: fixed;
			bottom: 16px;
			right: 20px;
			font-size: 0.85em;
			color: var(--vscode-descriptionForeground);
			background: var(--vscode-editorWidget-background);
			padding: 4px 12px;
			border-radius: 12px;
			border: 1px solid var(--vscode-widget-border, rgba(128,128,128,0.2));
		}

		/* Navigation arrows */
		.nav-arrow {
			position: fixed;
			top: 50%;
			transform: translateY(-50%);
			background: transparent;
			border: 1px solid var(--vscode-widget-border, rgba(128,128,128,0.2));
			color: var(--vscode-editor-foreground);
			font-size: 1.4em;
			width: 36px;
			height: 36px;
			border-radius: 50%;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background 0.15s ease, border-color 0.15s ease;
			z-index: 10;
		}

		.nav-arrow:hover {
			background: var(--vscode-list-hoverBackground);
			border-color: var(--vscode-focusBorder);
		}

		.nav-arrow.prev { left: 10px; }
		.nav-arrow.next { right: 10px; }

		.nav-arrow:disabled {
			opacity: 0.3;
			cursor: default;
		}

		.nav-arrow:disabled:hover {
			background: transparent;
			border-color: var(--vscode-widget-border, rgba(128,128,128,0.2));
		}

		.single-slide .nav-arrow,
		.single-slide .slide-counter {
			display: none;
		}
	</style>
</head>
<body class="{{SINGLE_SLIDE_CLASS}}">
	<button class="nav-arrow prev" aria-label="Previous slide">&#8249;</button>
	<button class="nav-arrow next" aria-label="Next slide">&#8250;</button>
	<div class="slide-container">
		<div class="slide-content">
			<pre class="mermaid"></pre>
		</div>
	</div>
	<div class="slide-counter"></div>

	<script type="module" nonce="{{NONCE}}">
		import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
		import { marked } from 'https://cdn.jsdelivr.net/npm/marked@15/lib/marked.esm.js';

		const slides = {{SLIDES_JSON}};
		let currentIndex = 0;

		mermaid.initialize({
			startOnLoad: false,
			theme: '{{THEME}}',
			securityLevel: 'loose'
		});

		marked.setOptions({
			gfm: true,
			breaks: false
		});

		const container = document.querySelector('.slide-content');
		const counter = document.querySelector('.slide-counter');
		const prevBtn = document.querySelector('.nav-arrow.prev');
		const nextBtn = document.querySelector('.nav-arrow.next');

		async function renderSlide(index) {
			currentIndex = index;
			const slide = slides[currentIndex];

			if (slide.type === 'mermaid') {
				container.innerHTML = '<pre class="mermaid">' + slide.content + '</pre>';
				try {
					await mermaid.run({ querySelector: '.mermaid' });
				} catch (error) {
					console.error('Mermaid rendering failed:', error);
					container.innerHTML = '<p style="color: var(--vscode-errorForeground);">Failed to render diagram ' + (currentIndex + 1) + '</p>';
				}
			} else if (slide.type === 'image') {
				container.innerHTML = '<div class="slide-image"><img src="' + escapeAttr(slide.content) + '" alt="Slide ' + (currentIndex + 1) + '"></div>';
			} else if (slide.type === 'markdown') {
				container.innerHTML = '<div class="slide-markdown">' + marked.parse(slide.content) + '</div>';
			}

			counter.textContent = (currentIndex + 1) + ' / ' + slides.length;
			prevBtn.disabled = currentIndex === 0;
			nextBtn.disabled = currentIndex === slides.length - 1;
		}

		function escapeAttr(str) {
			return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}

		function goNext() {
			if (currentIndex < slides.length - 1) {
				renderSlide(currentIndex + 1);
			}
		}

		function goPrev() {
			if (currentIndex > 0) {
				renderSlide(currentIndex - 1);
			}
		}

		document.addEventListener('keydown', (e) => {
			if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
				e.preventDefault();
				goNext();
			} else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
				e.preventDefault();
				goPrev();
			}
		});

		let scrollCooldown = false;
		document.addEventListener('wheel', (e) => {
			if (scrollCooldown) return;
			scrollCooldown = true;
			setTimeout(() => { scrollCooldown = false; }, 300);

			if (e.deltaY > 0) {
				goNext();
			} else if (e.deltaY < 0) {
				goPrev();
			}
		});

		prevBtn.addEventListener('click', goPrev);
		nextBtn.addEventListener('click', goNext);

		window.addEventListener('message', (event) => {
			const message = event.data;
			if (message.type === 'update') {
				slides.length = 0;
				slides.push(...message.slides);

				if (slides.length === 0) {
					container.innerHTML = '<p style="color: var(--vscode-descriptionForeground);">No presentation slides found.</p>';
					counter.textContent = '';
					document.body.classList.add('single-slide');
					return;
				}

				document.body.classList.toggle('single-slide', slides.length === 1);
				const newIndex = Math.min(currentIndex, slides.length - 1);
				renderSlide(newIndex);
			}
		});

		renderSlide(0);
	</script>
</body>
</html>
